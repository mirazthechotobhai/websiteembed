<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>Movie Lover TV - Fullscreen Web Viewer</title>
    <meta name="description" content="Full-screen TV, mobile, and emulator web view loading https://movielover-tau.vercel.app/?view=tv with multi-layer and video streaming support." />
    <meta property="og:title" content="Movie Lover TV - Fullscreen Web Viewer" />
    <meta property="og:description" content="Full-screen TV, mobile, and emulator web view loading https://movielover-tau.vercel.app/?view=tv with multi-layer and video streaming support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Standalone pure CSS so it NEVER shows a white screen on GitHub, TV, or offline */
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000000 !important;
        color: #ffffff;
      }
      #iframe-wrapper {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #000000;
        z-index: 1;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #fullscreen-webview-iframe {
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        display: block;
        background-color: #000000;
      }
      #root {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }
      #root > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <!-- 
      Your website URL is saved directly inside this HTML file!
      Loads full-screen edge-to-edge on GitHub, GitHub Pages, Smart TV, Android WebView, and local files without needing any build step!
    -->
    <div id="iframe-wrapper">
      <iframe
        id="fullscreen-webview-iframe"
        src="https://smart-tv-gamma.vercel.app/"
        title="Movie Lover TV"
        allow="accelerometer; ambient-light-sensor; autoplay; battery; camera; clipboard-read; clipboard-write; display-capture; document-domain; encrypted-media; execution-while-not-rendered; execution-while-out-of-viewport; fullscreen; geolocation; gyroscope; hid; idle-detection; magnetometer; microphone; midi; navigation-override; payment; picture-in-picture; publickey-credentials-get; screen-wake-lock; serial; speaker-selection; sync-xhr; usb; web-share; xr-spatial-tracking"
        allowfullscreen
      ></iframe>
    </div>

    <!-- Standalone native fallback logic for GitHub / Smart TV without build dependencies -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var qUrl = params.get('url') || (window.location.hash ? window.location.hash.slice(1) : '');
          if (qUrl) {
            var f = document.getElementById('fullscreen-webview-iframe');
            if (f) f.src = qUrl;
          }
        } catch(e) {}

        // TV Remote Back / Escape support
        window.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' || e.keyCode === 10009 || e.keyCode === 461 || e.keyCode === 4) {
            if (document.fullscreenElement) {
              document.exitFullscreen && document.exitFullscreen();
            } else {
              document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){});
            }
          }
        });
      })();
    </script>

    <!-- React App Container for interactive controls, settings, and modal tools -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
